[workspace]
resolver = "2"
members = [
    "crates/popcorn-core",
    "crates/popcorn-timelock",
    "crates/popcorn-node",
]

# Consensus-relevant dependencies are pinned EXACTLY (`=`), per SPEC.md §13:
# upgrading one of them is a declared consensus change, never a side effect of
# `cargo update`. The pinned set is mirrored in CONSENSUS-LOCK.md.
[workspace.dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
borsh = { version = "=1.8.1", features = ["derive", "de_strict_order"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "rand_core"] }
primitive-types = { version = "=0.14.0", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

# Non-consensus dependencies: the API surface, storage and the timelock transport.
# `age` is deliberately absent: it enters through tlock_age, which pins it, and declaring a
# second version here would only create a conflict to resolve. CONSENSUS-LOCK.md records the
# version the lockfile actually resolves.
axum = { version = "=0.8.9", features = ["ws"] }
drand_core = "=0.0.19"
redb = "=4.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tlock = "=0.0.10"
tlock_age = "=0.0.10"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }

popcorn-core = { path = "crates/popcorn-core" }
popcorn-timelock = { path = "crates/popcorn-timelock" }

[workspace.package]
version = "0.9.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
# Consensus-relevant, not an optimization knob (CONSENSUS-LOCK.md): decryption is a total
# function (SPEC.md §3.6, §5.1), and the node realizes that totality by containing an abnormal
# termination of the timelock primitive at the per-blob boundary with `catch_unwind`. Under
# `panic = "abort"` that containment is inert and one crafted blob aborts the whole process, so
# the setting is `unwind` and a future change to `abort` would reopen a remote halt.
panic = "unwind"
