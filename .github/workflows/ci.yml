name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  consensus:
    name: consensus gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; `rustup show` installs exactly that one,
      # components included. See the comment in that file for why it is pinned.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      # Structural rules that a test cannot express: no unordered collections anywhere near a
      # commitment (§2.3), exact dependency pinning (§13), and the naming rule.
      - name: Structural gates
        run: ./ci/consensus-gates.sh

      # Documentation is split across a dozen pages that cross-reference each other and the
      # specification's own section anchors. Those rot silently; this makes them rot loudly.
      - name: Documentation links
        run: python3 ci/check-docs.py

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --all-targets

      # Everything below is a precondition for producing genesis at all (SPEC.md §8, §2.3, §10).
      - name: Tests, including the consensus gates
        run: cargo test --workspace

      # §8 asks for millions of random sequences. The default is a fast slice for local runs;
      # here it runs the real thing — four seeds at two million operations each, which takes
      # seconds in release. A gate nobody runs at scale is not a gate.
      - name: Staking property gate (full)
        run: cargo test -p popcorn-core --release --test staking_gate
        env:
          POPCORN_GATE_ITERS: "2000000"

  reference:
    name: independent reference executor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install blake3

      # §10 asks for a second implementation as a differential. It found the missing bucket
      # in the monetary invariant; regenerating the scenarios here keeps it able to find the
      # next one, rather than only re-checking a frozen file.
      - name: Regenerate scenarios and replay them
        run: |
          cargo run --release -p popcorn-core --example differential -- 400 vectors/differential.json
          python3 reference/differential.py vectors/differential.json

      - name: Borderline signature semantics (§3.1)
        run: |
          cargo run --release -p popcorn-core --example signature_vectors -- vectors/signatures.json
          python3 reference/signatures.py vectors/signatures.json

  interop:
    name: cross-language gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Rust, Go and JavaScript must read each other's blobs and agree on every rejection
      # case (§2.4, §3.6). No network: the gate carries its own beacon signature.
      - name: Run the cross-language gate
        run: ./interop/run-gate.sh

  web:
    name: browser path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The wallet runs in a tab and decides what bytes the user's key signs, so it is
      # consensus-relevant code. This builds one transaction of every kind through the page's
      # own bundle and has the Rust and Go tools confirm they agree about the bytes, the
      # identity and the blob profile. It also fails if the committed bundle is stale — the
      # node compiles `web/dist` in, so a stale bundle would ship a page nobody tested.
      - name: Run the browser-path gate
        run: ./web/test/browser-path.sh

  availability:
    name: blind-collection worst case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # §11 requires this measurement before genesis, and the numbers quoted there come from
      # it. A smaller count here keeps CI honest without spending ten minutes on it; the full
      # 10,000-blob run is what §11 reports.
      - name: Measure the worst populations
        run: cargo run --release -p popcorn-timelock --example dos_benchmark -- 1000

  offline:
    name: no network needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The committed vector was produced against a real drand round; replaying it must need
      # nothing but the repository. If this job ever needs the network, the claim in §10 that
      # state replay is self-contained has quietly stopped being true.
      - name: Replay the committed vector
        run: cargo test -p popcorn-timelock --test vectors
